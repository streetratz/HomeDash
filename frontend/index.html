<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeDash</title>
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <!--
      Apply the stored theme before React mounts to avoid a flash of wrong theme.
      Default is dark mode (class present) unless the user has explicitly chosen light.
    -->
    <script>
      try {
        if (localStorage.getItem('homedash_theme') !== 'light') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
